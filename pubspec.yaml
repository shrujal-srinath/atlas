name: atlas
description: "ATLAS — Personal Performance OS"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter

  # Navigation
  go_router: ^14.6.3

  # Backend
  supabase_flutter: ^2.12.2

  # State management
  flutter_riverpod: ^2.6.1

  # Local cache (offline-first)
  hive_flutter: ^1.1.0

  # Charts
  fl_chart: ^0.71.0

  # Notifications
  flutter_local_notifications: ^19.2.1
  timezone: ^0.10.0
  flutter_timezone: ^4.0.0
  permission_handler: ^11.3.1

  # Barcode scanner
  mobile_scanner: ^7.0.1

  # Camera capture (photo proof on habit completion)
  image_picker: ^1.1.2
  path_provider: ^2.1.5
  path: ^1.9.1

  # Utilities
  intl: ^0.20.2
  shared_preferences: ^2.5.3
  uuid: ^4.5.1

  # Line icons (lucide, 1.5 stroke style)
  lucide_icons: ^0.257.0
  http: ^1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: SpaceGrotesk
      fonts:
        - asset: assets/fonts/SpaceGrotesk-Variable.ttf
          weight: 500
        - asset: assets/fonts/SpaceGrotesk-Variable.ttf
          weight: 600
        - asset: assets/fonts/SpaceGrotesk-Variable.ttf
          weight: 700
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Variable.ttf
          weight: 400
        - asset: assets/fonts/Inter-Variable.ttf
          weight: 500
        - asset: assets/fonts/Inter-Variable.ttf
          weight: 600
  assets:
    - assets/food_db/
