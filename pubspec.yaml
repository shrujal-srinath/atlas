name: atlas
description: "ATLAS — Personal Performance OS"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter

  # Navigation
  go_router: ^14.6.3

  # Backend
  supabase_flutter: ^2.12.2

  # State management
  flutter_riverpod: ^2.6.1

  # Local cache (offline-first)
  hive_flutter: ^1.1.0
  connectivity_plus: ^6.1.5

  # Charts
  fl_chart: ^0.71.0

  # Notifications
  flutter_local_notifications: ^19.2.1
  timezone: ^0.10.0
  flutter_timezone: ^4.0.0
  permission_handler: ^11.3.1

  # Barcode scanner
  mobile_scanner: ^7.0.1

  # Camera capture (photo proof on habit completion)
  image_picker: ^1.1.2
  path_provider: ^2.1.5
  path: ^1.9.1

  # Utilities
  intl: ^0.20.2
  shared_preferences: ^2.5.3
  uuid: ^4.5.1

  # Line icons (lucide, 1.5 stroke style)
  lucide_icons: ^0.257.0
  http: ^1.6.0
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # Release identity — generates launcher icons + native splash from assets/icon.
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.4

flutter:
  uses-material-design: true
  fonts:
    - family: SpaceGrotesk
      fonts:
        - asset: assets/fonts/SpaceGrotesk-Variable.ttf
          weight: 500
        - asset: assets/fonts/SpaceGrotesk-Variable.ttf
          weight: 600
        - asset: assets/fonts/SpaceGrotesk-Variable.ttf
          weight: 700
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Variable.ttf
          weight: 400
        - asset: assets/fonts/Inter-Variable.ttf
          weight: 500
        - asset: assets/fonts/Inter-Variable.ttf
          weight: 600

# ── Release identity ────────────────────────────────────────────────────
# Launcher icon: ruby score-ring + "A" monogram on Void-Fire black.
# Regenerate after editing assets/icon/*: `dart run flutter_launcher_icons`.
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/icon.png"
  min_sdk_android: 21
  remove_alpha_ios: true
  adaptive_icon_background: "#07090E"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"

# Native splash: centered mark on the Void-Fire background, light status bar.
# Regenerate: `dart run flutter_native_splash:create`.
flutter_native_splash:
  color: "#07090E"
  image: "assets/icon/splash.png"
  android_12:
    color: "#07090E"
    image: "assets/icon/splash.png"
  android: true
  ios: false
  web: false
